server {
    listen 80;
    server_name api.sagye-danji.site;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.sagye-danji.site;

    ssl_certificate     /etc/letsencrypt/live/api.sagye-danji.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sagye-danji.site/privkey.pem;

    client_max_body_size 20M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location ~ ^/(swagger-ui|v3/api-docs) {
        auth_basic "restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://app:8080;
    }

    location / {
        proxy_pass http://app:8080;
    }
}
