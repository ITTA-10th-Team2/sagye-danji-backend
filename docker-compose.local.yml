name: gyejol-danji-local

services:
  mysql:
    image: mysql:8.4
    container_name: gyejol-danji-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mysql-local-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    profiles: ["app"]
    build:
      context: .
    container_name: gyejol-danji-app-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
    volumes:
      - type: bind
        source: ${GOOGLE_SERVICE_ACCOUNT_JSON_PATH}
        target: /run/secrets/google-service-account.json
        read_only: true
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-local-data:
